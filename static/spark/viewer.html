<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SharpSplat Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, #1d2738 0%, #0b1020 55%, #05070d 100%); color: #e8eefc; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #overlay { position: fixed; left: 16px; top: 16px; z-index: 2; padding: 12px 14px; border-radius: 12px; background: rgba(10, 15, 28, 0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); max-width: 420px; }
    #title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    #status { font-size: 13px; color: #b8c3d9; line-height: 1.5; }
    #status.error { color: #ffb4b4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "three/addons/": "./addons/",
        "@sparkjsdev/spark": "./spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="title">SharpSplat Viewer</div>
    <div id="status">Loading viewer...</div>
  </div>
  <div id="stage"></div>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatLoader, SplatMesh } from "@sparkjsdev/spark";

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b1020, 8, 24);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0.2, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    stage.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    let splat = null;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const orbit = { radius: 4.5, theta: 0, phi: 0.2 };
    const loader = new SplatLoader();

    const applyOrbit = () => {
      const x = orbit.radius * Math.cos(orbit.phi) * Math.sin(orbit.theta);
      const y = orbit.radius * Math.sin(orbit.phi);
      const z = orbit.radius * Math.cos(orbit.phi) * Math.cos(orbit.theta);
      camera.position.set(x, y, z);
      camera.lookAt(0, 0, 0);
    };

    const setStatus = (message, error = false) => {
      status.textContent = message;
      status.classList.toggle("error", error);
    };

    if (!file) {
      setStatus("Missing file parameter.", true);
    } else {
      setStatus(`Loading ${file}...`);
      loader.loadAsync(file).then((loadedSplat) => {
        splat = new SplatMesh({ packedSplats: loadedSplat });
        splat.position.set(0, 0, 0);
        scene.add(splat);
        setStatus(`Loaded ${file}`);
      }).catch((error) => {
        setStatus(String(error), true);
      });
    }

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };

    window.addEventListener("resize", onResize);
    window.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const dx = (event.clientX - lastX) / window.innerWidth;
      const dy = (event.clientY - lastY) / window.innerHeight;
      lastX = event.clientX;
      lastY = event.clientY;
      orbit.theta -= dx * Math.PI * 1.5;
      orbit.phi = Math.max(-1.1, Math.min(1.1, orbit.phi - dy * Math.PI * 1.2));
      applyOrbit();
    });

    applyOrbit();

    renderer.setAnimationLoop(() => {
      if (splat) {
        splat.rotation.y += 0.002;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
