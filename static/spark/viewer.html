<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SharpSplat Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, #1d2738 0%, #0b1020 55%, #05070d 100%); color: #e8eefc; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #overlay { position: fixed; left: 16px; top: 16px; z-index: 2; padding: 12px 14px; border-radius: 12px; background: rgba(10, 15, 28, 0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); max-width: 420px; }
    #title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    #status { font-size: 13px; color: #b8c3d9; line-height: 1.5; }
    #status.error { color: #ffb4b4; }
    #fs-btn { position: fixed; right: 16px; top: 16px; z-index: 3; width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10,15,28,0.72); backdrop-filter: blur(12px); color: #b8c3d9; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
    #fs-btn:hover { background: rgba(40,50,80,0.8); color: #e8eefc; }
    #dbg-btn { position: fixed; right: 16px; top: 60px; z-index: 3; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10,15,28,0.72); backdrop-filter: blur(12px); color: #b8c3d9; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
    #dbg-btn:hover { background: rgba(40,50,80,0.8); color: #e8eefc; }
    #dbg-info { position: fixed; right: 16px; top: 98px; z-index: 3; padding: 8px 10px; border-radius: 8px; background: rgba(10,15,28,0.85); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); color: #b8c3d9; font-family: monospace; font-size: 11px; line-height: 1.5; min-width: 180px; display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "three/addons/": "./addons/",
        "@sparkjsdev/spark": "./spark.module.js"
      }
    }
</script>
</head>
<body>
  <button id="fs-btn" title="Fullscreen">&#x26F6;</button>
  <button id="dbg-btn" title="Debug">&#x3B4;</button>
  <div id="dbg-info">pos: --</div>
  <div id="overlay">
    <div id="title">SharpSplat Viewer</div>
    <div id="status">Loading viewer...</div>
  </div>
  <div id="stage"></div>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatLoader, SplatMesh } from "@sparkjsdev/spark";

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b1020, 8, 24);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 1000);

    // 初始相机位置设置
    camera.position.set(0, -0.2, 1);

    // 初始"正视图像"时的朝前方向：从初始相机坐标 (0,-0.2,1) 指向原点，
    // 主要是 -Z，带一点 +Y 的仰角修正
    const INITIAL_FORWARD = new THREE.Vector3(0, 0, 0)
      .sub(new THREE.Vector3(0, -0.2, 1))
      .normalize();
    const LOOK_BIAS = 1; // 瞄准点沿 INITIAL_FORWARD 方向偏移的距离，调大偏向图像更明显
    const LOOK_TARGET = new THREE.Vector3(0, 0, 0).addScaledVector(INITIAL_FORWARD, LOOK_BIAS);

    camera.lookAt(LOOK_TARGET);

    // 右/上方向只在初始化时算一次，作为平移的固定参考轴；
    // 相机朝向不锁定，每次移动后都会重新 lookAt(LOOK_TARGET)
    const RIGHT_AXIS = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const UP_AXIS = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    stage.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    let splat = null;
    const loader = new SplatLoader();
    const keys = {};
    const clock = new THREE.Clock();
    const KEY_MOVE_SPEED = 0.6; // WASD 平移速度，会按当前缩放距离等比调整
    const ZOOM_SPEED = 0.1;     // 每次滚轮的等比缩放系数
    const MIN_R = 0.1;          // 相机离原点的最小距离，防止穿过原点导致 NaN


    const setStatus = (message, error = false) => {
      status.textContent = message;
      status.classList.toggle("error", error);
    };

    if (!file) {
      setStatus("Missing file parameter.", true);
    } else {
      setStatus(`Loading ${file}...`);
      loader.loadAsync(file).then((loadedSplat) => {
        splat = new SplatMesh({ packedSplats: loadedSplat });
        splat.position.set(0, 0, 0);
        scene.add(splat);
        splat.rotation.x = Math.PI;
        setStatus(`Loaded ${file}`);
      }).catch((error) => {
        setStatus(String(error), true);
      });
    }

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };

    window.addEventListener("resize", onResize);

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (keys['w'] || keys['W'] || keys['s'] || keys['S'] || keys['a'] || keys['A'] || keys['d'] || keys['D']) {
        // 平移速度按当前离 LOOK_TARGET（图像中心）的距离等比缩放，近处细腻、远处依然有效
        const toCam = camera.position.clone().sub(LOOK_TARGET);
        const r = Math.max(toCam.length(), MIN_R);
        const speed = KEY_MOVE_SPEED * r;
        if (keys['w'] || keys['W']) { camera.position.addScaledVector(UP_AXIS, speed * dt); }
        if (keys['s'] || keys['S']) { camera.position.addScaledVector(UP_AXIS, -speed * dt); }
        if (keys['a'] || keys['A']) { camera.position.addScaledVector(RIGHT_AXIS, -speed * dt); }
        if (keys['d'] || keys['D']) { camera.position.addScaledVector(RIGHT_AXIS, speed * dt); }
        // 防止平移把相机带到 LOOK_TARGET 附近，否则滚轮缩放的 normalize() 会算出 NaN
        const afterToCam = camera.position.clone().sub(LOOK_TARGET);
        if (afterToCam.lengthSq() < MIN_R * MIN_R) {
          if (afterToCam.lengthSq() < 1e-10) {
            camera.position.copy(LOOK_TARGET).add(new THREE.Vector3(0, 0, MIN_R));
          } else {
            camera.position.copy(LOOK_TARGET).addScaledVector(afterToCam.normalize(), MIN_R);
          }
        }
        // 始终朝向图像正前方偏移点：位置变化后重新对准，上下左右移动都保持看向该点
        camera.lookAt(LOOK_TARGET);
      }
      renderer.render(scene, camera);
    });
    window.addEventListener('keydown', (event) => {
      keys[event.key] = true;
    });
    window.addEventListener('keyup', (event) => {
      keys[event.key] = false;
    });
    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      const toCam = camera.position.clone().sub(LOOK_TARGET);
      const dir = toCam.clone().normalize();
      const r = toCam.length();
      // 等比缩放：远处大步长、近处小步长，避免线性增量导致近处失控
      const factor = event.deltaY > 0 ? (1 + ZOOM_SPEED) : (1 - ZOOM_SPEED);
      const newR = Math.max(MIN_R, r * factor);
      camera.position.copy(LOOK_TARGET).addScaledVector(dir, newR);
      camera.lookAt(LOOK_TARGET);
    }, { passive: false });
    const fsBtn = document.getElementById("fs-btn");
    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.body.requestFullscreen();
        fsBtn.innerHTML = "&#x22A0;";
      } else {
        document.exitFullscreen();
        fsBtn.innerHTML = "&#x26F6;";
      }
    });
    document.addEventListener("fullscreenchange", () => {
      fsBtn.innerHTML = document.fullscreenElement ? "&#x22A0;" : "&#x26F6;";
    });
    const dbgBtn = document.getElementById("dbg-btn");
    const dbgInfo = document.getElementById("dbg-info");
    let dbgShow = false;
    dbgBtn.onclick = () => { dbgShow = !dbgShow; dbgInfo.style.display = dbgShow ? "block" : "none"; };
    setInterval(() => {
      if (dbgShow) {
        const r = camera.position.length();
        const t = Math.atan2(camera.position.x, camera.position.z);
        const ph = Math.asin(Math.max(-1, Math.min(1, camera.position.y / r)));
        dbgInfo.innerHTML = "pos: " + camera.position.x.toFixed(3) + ", " + camera.position.y.toFixed(3) + ", " + camera.position.z.toFixed(3) + "<br>r: " + r.toFixed(3) + " \u03B8: " + (t * 180 / Math.PI).toFixed(1) + "\u00B0 \u03C6: " + (ph * 180 / Math.PI).toFixed(1) + "\u00B0";
      }
    }, 100);
  </script>
</body>
</html>
