<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SharpSplat Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, #1d2738 0%, #0b1020 55%, #05070d 100%); color: #e8eefc; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #overlay { position: fixed; left: 16px; top: 16px; z-index: 2; padding: 12px 14px; border-radius: 12px; background: rgba(10, 15, 28, 0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); max-width: 420px; }
    #title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    #status { font-size: 13px; color: #b8c3d9; line-height: 1.5; }
    #status.error { color: #ffb4b4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "three/addons/": "./addons/",
        "@sparkjsdev/spark": "./spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="title">SharpSplat Viewer</div>
    <div id="status">Loading viewer...</div>
  </div>
  <div id="stage"></div>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatLoader, SplatMesh } from "@sparkjsdev/spark";

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b1020, 8, 24);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 1000);

    // 初始相机位置设置
    camera.position.set(0, -0.2, 1);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    stage.appendChild(renderer.domElement);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    let splat = null;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const loader = new SplatLoader();
    const keys = {};
    const clock = new THREE.Clock();
    const MOVE_SPEED = 2.5;
    const ZOOM_SPEED = 2.5;


    const setStatus = (message, error = false) => {
      status.textContent = message;
      status.classList.toggle("error", error);
    };

    if (!file) {
      setStatus("Missing file parameter.", true);
    } else {
      setStatus(`Loading ${file}...`);
      loader.loadAsync(file).then((loadedSplat) => {
        splat = new SplatMesh({ packedSplats: loadedSplat });
        splat.position.set(0, 0, 0);
        scene.add(splat);
        splat.rotation.x = Math.PI;
        setStatus(`Loaded ${file}`);
      }).catch((error) => {
        setStatus(String(error), true);
      });
    }

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };

    window.addEventListener("resize", onResize);
    window.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const dx = (event.clientX - lastX) / window.innerWidth;
      const dy = (event.clientY - lastY) / window.innerHeight;
      lastX = event.clientX;
      lastY = event.clientY;
      const r = camera.position.length();
      const t = Math.atan2(camera.position.x, camera.position.z);
      const p = Math.asin(Math.max(-1, Math.min(1, camera.position.y / r)));
      const s = Math.max(0.05, Math.min(r, 1.0));
      const nt = t - dx * Math.PI * 1.5 * s;
      const np = Math.max(-1.4, Math.min(1.4, p - dy * Math.PI * 1.2 * s));
      camera.position.set(r * Math.cos(np) * Math.sin(nt), r * Math.sin(np), r * Math.cos(np) * Math.cos(nt));
      camera.lookAt(0, 0, 0);
    });

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (keys['w'] || keys['W'] || keys['s'] || keys['S'] || keys['a'] || keys['A'] || keys['d'] || keys['D'] || keys['q'] || keys['Q'] || keys['e'] || keys['E']) {
        const q = camera.quaternion;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(q);
        const upv = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
        if (keys['w'] || keys['W']) { camera.position.addScaledVector(fwd, MOVE_SPEED * dt); }
        if (keys['s'] || keys['S']) { camera.position.addScaledVector(fwd, -MOVE_SPEED * dt); }
        if (keys['a'] || keys['A']) { camera.position.addScaledVector(right, -MOVE_SPEED * dt); }
        if (keys['d'] || keys['D']) { camera.position.addScaledVector(right, MOVE_SPEED * dt); }
        if (keys['q'] || keys['Q']) { camera.position.addScaledVector(upv, MOVE_SPEED * dt); }
        if (keys['e'] || keys['E']) { camera.position.addScaledVector(upv, -MOVE_SPEED * dt); }
      }
      renderer.render(scene, camera);
    });
    window.addEventListener('keydown', (event) => {
      keys[event.key] = true;
    });
    window.addEventListener('keyup', (event) => {
      keys[event.key] = false;
    });
    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      const dir = new THREE.Vector3().copy(camera.position).normalize();
      camera.position.copy(dir.multiplyScalar(Math.max(0.05, camera.position.length() + Math.sign(event.deltaY) * ZOOM_SPEED * 0.05)));
      camera.lookAt(0, 0, 0);
    }, { passive: false });
  </script>
</body>
</html>
