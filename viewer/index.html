<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SharpSplat 3D Viewer</title>
<style>
body{overflow:hidden;margin:0;height:100vh;width:100vw;background:#000;color:#fff;font-family:sans-serif;text-shadow:0 0 3px #000}
#info{z-index:100;position:absolute;top:10px;left:15px}
#progress{position:absolute;top:0;height:5px;background:blue;z-index:99;transition:width .1s}
#canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.scene,#message{position:absolute;display:flex;top:0;right:0;left:0;bottom:0;z-index:2;align-items:center;justify-content:center}
#message{font-weight:bold;font-size:large;color:red;pointer-events:none}
details{font-size:small}
#quality{position:absolute;bottom:10px;z-index:999;right:10px;color:#fff;font-size:12px}
#instructions{background:rgba(0,0,0,.6);white-space:pre-wrap;padding:10px;border-radius:10px;font-size:x-small}
</style>
</head>
<body>
<div id="info">
<h3>SharpSplat 3D Viewer</h3>
<details><summary>操作</summary><div id="instructions">鼠标拖拽旋转 · 滚轮缩放</div></details>
</div>
<div id="progress"></div>
<div id="message"></div>
<div class="scene" id="spinner"><div style="color:#fff">加载中...</div></div>
<canvas id="canvas"></canvas>
<span id=camid></span><div id=quality><span id=fps></span></div>
<script src="viewer.js"></script>
</body>
</html>
