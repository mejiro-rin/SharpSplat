[project]
name = "sharpsplat"
version = "0.1.0"
description = "图形化 SHARP 3D Gaussian Splatting 生成与浏览工具"
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.20.0",
    "sharp",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sharp = { git = "https://github.com/apple/ml-sharp.git" }
